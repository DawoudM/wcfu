version: "3.9"

services:
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: health_backend
    env_file: ./server/.env
    volumes:
      - ./data:/app/data
    expose:
      - "8000"
    restart: unless-stopped
    # Use healthcheck to ensure Gunicorn is responding before Nginx proxies to it
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health/measurement/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: health_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  data:
    driver: local
