<div class="auth-container">
  <div class="theme-toggle-wrapper">
    <app-theme-toggle></app-theme-toggle>
  </div>

  <mat-card class="auth-card elevation-z8">
    <mat-card-header>
      <div mat-card-avatar class="header-image">
        <mat-icon color="primary">favorite</mat-icon>
      </div>
      <mat-card-title>Health Calculator</mat-card-title>
      <mat-card-subtitle>Sign in to your account</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="auth-form">
        
        <div class="error-message" *ngIf="error">
          <mat-icon color="warn">error_outline</mat-icon>
          <span>{{ error }}</span>
        </div>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Username</mat-label>
          <mat-icon matPrefix>person</mat-icon>
          <input matInput formControlName="username" placeholder="Enter your username" required>
          <mat-error *ngIf="loginForm.get('username')?.hasError('required')">
            Username is required
          </mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Password</mat-label>
          <mat-icon matPrefix>lock</mat-icon>
          <input matInput [type]="hidePassword ? 'password' : 'text'" formControlName="password" required>
          <button mat-icon-button matSuffix (click)="hidePassword = !hidePassword" type="button" [attr.aria-label]="'Hide password'" [attr.aria-pressed]="hidePassword">
            <mat-icon>{{hidePassword ? 'visibility_off' : 'visibility'}}</mat-icon>
          </button>
          <mat-error *ngIf="loginForm.get('password')?.hasError('required')">
            Password is required
          </mat-error>
        </mat-form-field>

        <div class="form-actions">
          <button mat-flat-button color="primary" type="submit" [disabled]="isLoading" class="submit-btn">
            <mat-icon *ngIf="!isLoading">login</mat-icon>
            <span *ngIf="!isLoading">Sign In</span>
            <span *ngIf="isLoading" class="spinner"></span>
          </button>
        </div>
      </form>
    </mat-card-content>

    <mat-card-actions class="card-footer">
      <span class="footer-text">Don't have an account?</span>
      <a mat-button color="primary" routerLink="/auth/register">Create one</a>
    </mat-card-actions>
  </mat-card>
</div>
